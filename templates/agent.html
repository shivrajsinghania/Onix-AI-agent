<!DOCTYPE html>
<html>
  <head>
    <title>AI Agent</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/agent.css') }}">
  </head>
  <body>
    <div class="container">
      <h1>AI Agent</h1>
      <div class="status">Autonomous Workflow Prototype</div>
      <div class="tabs">
        <button onclick="showTab('chat')">Chat</button>
        <button onclick="loadHistory()">History</button>
        <button onclick="loadQueue()">Queue</button>
        <button onclick="loadWorkflows()">Workflows</button>
      </div>
      <div id="chat-tab">
        <div class="input-box">
          <textarea id="message" placeholder="Tell your agent what to do..."></textarea>
          <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
        <pre id="output">Waiting for command...</pre>
      </div>
      <div id="data-tab"></div>
    </div>
    
    <script>
      async function sendMessage() {
        let message = document.getElementById("message").value.trim()
        if (!message) return
        document.getElementById("output").innerText = "Processing..."
        let response = await fetch("/ask", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({message: message})
        })
        let data = await response.json()
        document.getElementById("output").innerText = JSON.stringify(data, null, 2)
        document.getElementById("message").value = ""
      }
      
      function showTab(tab) {
        if (tab === "chat") {
          document.getElementById("chat-tab").style.display = "block"
          document.getElementById("data-tab").innerHTML = ""
        }
      }
      
      async function loadHistory() {
        document.getElementById("chat-tab").style.display = "none"
        let response = await fetch("/history")
        let data = await response.json()
        renderData(data, "History")
      }
      
      async function loadQueue() {
        document.getElementById("chat-tab").style.display = "none"
        let response = await fetch("/queue")
        let data = await response.json()
        renderData(data, "Queue")
      }
      
      async function loadWorkflows() {
        document.getElementById("chat-tab").style.display = "none"
        let response = await fetch("/workflows")
        let data = await response.json()
        renderData(data, "Workflows")
      }
      
      function renderData(data, title) {
        let type = ""
        if (title === "History") {
          type = "history"
        } else if (title === "Queue") {
          type = "queue"
        } else if (title === "Workflows") {
          type = "workflow"
        }
      
        let html = `
        <div class="title-row">
        <h2>${title}</h2>
        <button class="clear-btn" onclick="clearAll('${type}')">Clear All</button>
        </div>
        `
        data.forEach(item => {
          let humanText = ""
          let task = item.task || item.workflow || item
          
          if (typeof task === "string") {
            task = JSON.parse(task)
          }
          
          // workflow array
          if (Array.isArray(task)) {
            humanText = `🧠 Workflow with ${task.length} steps`
          }
          // single task
          else if (task) {
            if (task.action === "search") {
              humanText = `🔎 Searched "${task.query}" on ${task.app}`
            }
            else if (task.action === "send_message") {
              humanText = `📩 Sent message to ${task.target}`
            }
            else if (task.action === "open_website") {
              humanText = `🌐 Opened ${task.url}`
            }
            else if (task.action === "observe_website") {
              humanText = `👀 Observed ${task.url}`
            }
            else if (task.action === "type_text") {
              humanText = `⌨️ Typed "${task.text}"`
            }
            else if (task.action === "click_element") {
              humanText = `🖱️ Clicked ${task.element}`
            }
            else {
              humanText = `⚙️ ${task.action}`
            }
          }
          
          let statusColor = "#94a3b8"
          if (item.status === "completed") {
            statusColor = "#22c55e"
          }
          else if (item.status === "failed") {
            statusColor = "#ef4444"
          }
          else if (item.status === "running") {
            statusColor = "#eab308"
          }
          else if (item.status === "pending") {
            statusColor = "#64748b"
          }
          else if (item.status === "permanently_failed") {
            statusColor = "#dc2626"
          }
          html += `
          <div class="card">
          <div class="human-header">
          ${humanText}
          </div>
          <div
          class="status-badge"
          style="background:${statusColor}">
          ${item.status || "stored"}
          </div>
          <details>
          <summary>Raw JSON</summary>
          <pre>
          ${JSON.stringify(item, null, 2)}
          </pre>
          <button class="delete-btn" onclick="deleteItem(${item.id}, '${type}')">
          🗑
          </button>
          </details>
          </div>
          `
        })
        document.getElementById("data-tab").innerHTML = html
      }
      
      async function deleteItem(id, type) {
        let confirmed = confirm("Are you sure want to delete this item?")
        if (!confirmed) {
          return
        }
        
        let response = await fetch(`/delete/${type}/${id}`, {
          method: "DELETE"
        })
        
        let data = await response.json()
        
        console.log(data)
        
        if (type === "history") {
          loadHistory()
        } else if (type === "queue") {
          loadQueue()
        } else if (type === "workflow") {
          loadWorkflows()
        }
      }
      
      async function clearAll(type) {
        let confirmed = confirm("Are you sure wanna delete this entire table?")
        if (!confirmed) {
          return
        }
        let response = await fetch(`/clear/${type}`, {
          method: "DELETE"
        })
        
        if (type === "history") {
          loadHistory()
        } else if (type === "queue") {
          loadQueue()
        } else if (type === "workflow") {
          loadWorkflows()
        }
      }
    </script>
  </body>
</html>

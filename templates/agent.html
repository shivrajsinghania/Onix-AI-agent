<!DOCTYPE html>
<html>
  <head>
    <title>Onix</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/agent.css') }}">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#38bdf8">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
  </head>
  <body>

    <!-- Sidebar overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-profile">
        <div class="profile-avatar">
          <img src="/static/icon-192.png" alt="Onix">
        </div>
        <div class="profile-info">
          <div class="profile-name">Onix Agent</div>
          <div class="profile-sub">Autonomous AI</div>
        </div>
        <button class="settings-btn" onclick="openSettings()" title="Settings">
          <!-- gear icon -->
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>

      <div class="sidebar-section-label">History</div>
      <div class="sidebar-content" id="sidebarContent">
        <p class="sidebar-empty">Loading...</p>
      </div>

      <!-- View all history button -->
      <div class="sidebar-footer">
        <button class="sidebar-view-all" id="viewAllHistoryBtn" onclick="openHistoryPopup()">View all history →</button>
      </div>
    </div>

    <!-- History choice popup (outside sidebar so it's not clipped) -->
    <div class="history-popup" id="historyPopup">
      <button class="history-popup-item" onclick="closeHistoryPopup(); closeSidebar(); loadChatSessions()">
        <span>💬</span> Chat History
      </button>
      <button class="history-popup-item" onclick="closeHistoryPopup(); closeSidebar(); loadHistory()">
        <span>⚙️</span> Task History
      </button>
    </div>

    <!-- Settings modal -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeSettings()"></div>
    <div class="settings-modal" id="settingsModal">
      <div class="modal-header">
        <span>Settings</span>
        <button class="modal-close-btn" onclick="closeSettings()">✕</button>
      </div>
      <div class="modal-body">
        <button class="modal-item" onclick="openSection('queue')">
          <span class="modal-icon">📋</span>
          <div>
            <div class="modal-item-title">Queue</div>
            <div class="modal-item-sub">Pending tasks</div>
          </div>
        </button>
        <button class="modal-item" onclick="openSection('workflows')">
          <span class="modal-icon">🧠</span>
          <div>
            <div class="modal-item-title">Workflows</div>
            <div class="modal-item-sub">Saved automations</div>
          </div>
        </button>
        <button class="modal-item" onclick="openSection('results')">
          <span class="modal-icon">👀</span>
          <div>
            <div class="modal-item-title">Results</div>
            <div class="modal-item-sub">Observation data</div>
          </div>
        </button>
        <div class="modal-divider"></div>
        <button class="modal-item modal-item-danger" onclick="sessionLogout()">
          <span class="modal-icon">🚪</span>
          <div>
            <div class="modal-item-title">Logout</div>
            <div class="modal-item-sub">Sign out of Onix</div>
          </div>
        </button>
      </div>
    </div>
    
    <!-- Logout confirmation modal -->
    <div class="logout-modal-overlay" id="logoutModal" onclick="hideLogoutModal()">
      <div class="logout-modal-box" onclick="event.stopPropagation()">
        <div class="logout-modal-icon">🚪</div>
        <div class="logout-modal-title">Logout</div>
        <div class="logout-modal-sub">Are you sure you want to sign out?</div>
        <div class="logout-modal-actions">
          <button class="logout-cancel-btn" onclick="hideLogoutModal()">Cancel</button>
          <button class="logout-confirm-btn" onclick="confirmLogout()">Yes, logout</button>
        </div>
      </div>
    </div>

    <!-- Top bar -->
    <div class="topbar">
      <button class="menu-btn" onclick="openSidebar()">
        <span></span><span></span><span></span>
      </button>
      <span class="topbar-title" id="topbarTitle">Onix</span>
      <button class="new-chat-btn" onclick="newChat()" title="New chat">
        <!-- compose/new icon -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/>
          <path d="M18.37 2.63a2 2 0 1 1 2.83 2.83L12 14.5l-4 1 1-4 9.37-9.37z"/>
        </svg>
      </button>
    </div>

    <!-- Main area -->
    <div class="main-area" id="mainArea">
      <!-- Chat view (default) -->
      <div id="chat-view">
        <div id="chat-messages">
          <div id="output" class="output-empty">
            <div class="empty-icon">
              <img src="/static/icon-192.png" alt="Onix">
            </div>
            <div class="empty-title">
              What can I do for you?
            </div>
            <div class="empty-sub">
              Type a command below to get started.
            </div>
          </div>
        </div>
      </div>
      <!-- Data view (history / queue / workflows / results) -->
      <div id="data-view" style="display:none"></div>
    </div>

    <!-- Input bar (hidden when on data views) -->
    <div class="input-bar" id="inputBar">
      <div class="input-box">
        <textarea id="message" placeholder="Tell Onix what to do..." rows="1"
          onkeydown="handleKey(event)"></textarea>
        <button class="mic-btn" id="micButton" onclick="startVoiceInput()" title="Voice input">
          <!-- mic icon -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </button>
        <button class="send-btn" onclick="sendMessage()" title="Send">
          <!-- send arrow icon -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Logout animation screen -->
    <div class="logout-screen" id="logoutScreen">
      <div class="logout-screen-inner">
        <div class="logout-screen-icon">👋</div>
        <div class="logout-screen-text">Signing out…</div>
      </div>
    </div>

    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/static/js/service-worker.js")
          .then(() => console.log("Service Worker Registered"))
          .catch(error => console.error("Service Worker Error:", error))
      }
    </script>
    <script src="{{ url_for('static', filename='js/agent.js') }}"></script>
  </body>
</html>

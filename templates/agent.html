<!-- agent.html -->
<!DOCTYPE html>
<html>
  <head>
    <title>Onix</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sidebar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chat.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/task.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/research.css') }}">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#38bdf8">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
  </head>
  <body>

    <!-- Sidebar overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-profile">
        <div class="profile-avatar">
          <img src="/static/icon-192.png" alt="Onix">
        </div>
        <div class="profile-info">
          <div class="profile-name">Onix Agent</div>
          <div class="profile-sub">Autonomous AI</div>
        </div>
        <button class="settings-btn" onclick="openSettings()" title="Settings">
          <!-- gear icon -->
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>

      <div class="sidebar-section-label">Recent Chats</div>
      <div class="sidebar-content" id="sidebarContent">
        <p class="sidebar-empty">Loading...</p>
      </div>

      <!-- View all history buttons -->
      <div class="sidebar-footer">
        <div class="sidebar-history-row">
          <button class="sidebar-hist-btn" onclick="closeSidebar(); loadChatSessions()">
            💬 Chat History
          </button>
          <button class="sidebar-hist-btn" onclick="closeSidebar(); loadHistory()">
            ⚙️ Task History
          </button>
        </div>
      </div>
    </div>

    <!-- Settings modal -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeSettings()"></div>
    <div class="settings-modal" id="settingsModal">
      <div class="modal-header">
        <span>Settings</span>
        <button class="modal-close-btn" onclick="closeSettings()">✕</button>
      </div>
      <div class="modal-body">
        <button class="modal-item" onclick="openSection('queue')">
          <span class="modal-icon">📋</span>
          <div>
            <div class="modal-item-title">Queue</div>
            <div class="modal-item-sub">Pending tasks</div>
          </div>
        </button>
        <button class="modal-item" onclick="openSection('workflows')">
          <span class="modal-icon">🧠</span>
          <div>
            <div class="modal-item-title">Workflows</div>
            <div class="modal-item-sub">Saved automations</div>
          </div>
        </button>
        <button class="modal-item" onclick="openSection('results')">
          <span class="modal-icon">👀</span>
          <div>
            <div class="modal-item-title">Results</div>
            <div class="modal-item-sub">Observation data</div>
          </div>
        </button>
        <div class="modal-divider"></div>
        <button class="modal-item modal-item-danger" onclick="sessionLogout()">
          <span class="modal-icon">🚪</span>
          <div>
            <div class="modal-item-title">Logout</div>
            <div class="modal-item-sub">Sign out of Onix</div>
          </div>
        </button>
      </div>
    </div>
    
    <!-- Logout confirmation modal -->
    <div class="logout-modal-overlay" id="logoutModal" onclick="hideLogoutModal()">
      <div class="logout-modal-box" onclick="event.stopPropagation()">
        <div class="logout-modal-icon">🚪</div>
        <div class="logout-modal-title">Logout</div>
        <div class="logout-modal-sub">Are you sure you want to sign out?</div>
        <div class="logout-modal-actions">
          <button class="logout-cancel-btn" onclick="hideLogoutModal()">Cancel</button>
          <button class="logout-confirm-btn" onclick="confirmLogout()">Yes, logout</button>
        </div>
      </div>
    </div>

    <!-- Top bar -->
    <div class="topbar">
      <button class="menu-btn" onclick="openSidebar()">
        <span></span><span></span><span></span>
      </button>
      <div class="mode-toggle" id="modeToggle">
        <button class="mode-btn active" id="modeTaskBtn" onclick="switchMode('task')">Task</button>
        <button class="mode-btn" id="modeChatBtn" onclick="switchMode('chat')">Chat</button>
      </div>
      <button class="new-chat-btn" onclick="newChat()" title="New chat">
        <!-- compose/new icon -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/>
          <path d="M18.37 2.63a2 2 0 1 1 2.83 2.83L12 14.5l-4 1 1-4 9.37-9.37z"/>
        </svg>
      </button>
    </div>

    <!-- Main area -->
    <div class="main-area no-inputbar" id="mainArea">
      <!-- Chat view (hidden by default — Task is default mode) -->
      <div id="chat-view" style="display:none">
        <div id="chat-messages">
          <div id="output" class="output-empty">
            <div class="empty-icon">
              <img src="/static/icon-192.png" alt="Onix">
            </div>
            <div class="empty-title">
              What can I do for you?
            </div>
            <div class="empty-sub">
              Type a command below to get started.
            </div>
          </div>
        </div>
      </div>
      <!-- Data view (history / queue / workflows / results) -->
      <div id="data-view" style="display:none"></div>
      <!-- Task view -->
      <div id="task-view">
        <div class="task-panel">
          <div class="task-panel-toprow">
            <div class="task-panel-heading">
              <div class="task-panel-icon-title">
                <span class="task-panel-icon">🏛️</span>
                <span class="task-panel-title">Research a Service</span>
              </div>
              <div class="task-panel-sub">Pick a service and get full info instantly</div>
            </div>
            <div class="task-state-chip">
              <div class="onix-dd onix-dd-state" id="stateDD">
                <button type="button" class="onix-dd-trigger" onclick="toggleTaskDropdown('stateDD')">
                  <span class="onix-dd-trigger-label" id="stateDDLabel">📍 Bihar</span>
                  <svg class="onix-dd-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                </button>
                <div class="onix-dd-menu">
                  <div class="onix-dd-list" id="stateDDList"></div>
                </div>
              </div>
              <input type="hidden" id="taskState" value="Bihar">
            </div>
          </div>
          <div class="onix-dd onix-dd-service" id="serviceDD">
            <button type="button" class="onix-dd-trigger" onclick="toggleTaskDropdown('serviceDD')">
              <span class="onix-dd-trigger-label placeholder" id="serviceDDLabel">Select a government service…</span>
              <svg class="onix-dd-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div class="onix-dd-menu">
              <div class="onix-dd-search-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" class="onix-dd-search" id="serviceDDSearch" placeholder="Tap to search services…" readonly onfocus="this.removeAttribute('readonly')" oninput="filterServiceOptions(this.value)">
              </div>
              <div class="onix-dd-drill-header" id="serviceDDDrillHeader"></div>
              <div class="onix-dd-list" id="serviceDDList"></div>
            </div>
          </div>
          <div class="onix-dd-backdrop" id="serviceDDBackdrop" onclick="closeAllTaskDropdowns()"></div>
          <input type="hidden" id="taskService" value="">
          <input type="hidden" id="taskVariantId" value="">
          <button class="task-research-btn" id="taskResearchBtn" onclick="runTaskResearch()">
            <span id="taskResearchBtnText">🔍 Research</span>
          </button>
        </div>
        <div id="task-result"></div>
      </div>
    </div>

    <!-- Input bar (hidden in task mode — task is default) -->
    <div class="input-bar" id="inputBar" style="display:none">
      <div class="input-box">
        <div class="chat-composer">
          <button class="composer-btn composer-plus-btn" id="composerPlusButton" type="button" title="Add attachment" aria-label="Add attachment">
            <span class="composer-plus-icon">+</span>
          </button>

          <textarea id="message" class="composer-textarea" placeholder="Tell Onix what to do..." rows="1"
            onkeydown="handleKey(event)"></textarea>

          <div class="composer-actions">
            <button class="composer-btn mic-btn" id="micButton" type="button" onclick="startVoiceInput()" title="Voice input" aria-label="Voice input">
              <!-- mic icon -->
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                <line x1="12" y1="19" x2="12" y2="23"/>
                <line x1="8" y1="23" x2="16" y2="23"/>
              </svg>
            </button>

            <button class="composer-btn send-btn" id="sendButton" type="button" onclick="sendMessage()" title="Send" aria-label="Send message">
              <span class="send-arrow">↑</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Research overlay (fullscreen detail view — task mode) -->
    <div class="rc-overlay" id="researchOverlay">
      <div class="rc-overlay-topbar">
        <div class="rc-overlay-topbar-title" id="researchOverlayTitle">Research</div>
        <button class="rc-overlay-close" onclick="closeResearchOverlay()" title="Close">✕</button>
      </div>
      <div class="rc-overlay-body" id="researchOverlayBody"></div>
    </div>

    <!-- Logout animation screen -->
    <div class="logout-screen" id="logoutScreen">
      <div class="logout-screen-inner">
        <div class="logout-screen-icon">👋</div>
        <div class="logout-screen-text">Signing out…</div>
      </div>
    </div>

    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/static/js/service-worker.js")
          .then(() => console.log("Service Worker Registered"))
          .catch(error => console.error("Service Worker Error:", error))
      }
    </script>
    <script src="{{ url_for('static', filename='js/agent-infra.js') }}"></script>
    <script src="{{ url_for('static', filename='js/agent-render.js') }}"></script>
    <script src="{{ url_for('static', filename='js/agent-chat.js') }}"></script>
    <script src="{{ url_for('static', filename='js/agent-task.js') }}"></script>
  </body>
</html>
